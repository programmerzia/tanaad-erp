<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eceef1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Tanaad" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tanaad" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Tanaad Management System: mats, bags and recycling in one app that works offline." />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Tanaad</title>
    <script>
      // Set theme and density before first paint so there is no flash.
      (function () { try {
        var t = localStorage.getItem('tanaad-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var d = localStorage.getItem('tanaad-density') || ((matchMedia('(pointer: coarse)').matches || innerWidth < 900) ? 'touch' : 'compact');
        document.documentElement.dataset.theme = t; document.documentElement.dataset.density = d;
      } catch (e) {} })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
